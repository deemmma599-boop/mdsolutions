<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0A0C10;
      color: #EAEEF5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* subtle gradient backdrop */
    .bg-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 40%, rgba(0, 120, 255, 0.06) 0%, transparent 50%),
                  radial-gradient(circle at 70% 60%, rgba(120, 0, 255, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 32px;
      padding: 56px 36px 48px;
      backdrop-filter: blur(8px);
    }

    .icon {
      margin-bottom: 28px;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .icon svg {
      width: 80px;
      height: 80px;
      filter: drop-shadow(0 0 24px rgba(59, 158, 255, 0.25));
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #91C9FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 1rem;
      color: #8A9AAB;
      max-width: 320px;
      margin: 0 auto;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, #3B9EFF, #8B5CF6);
      border-radius: 2px;
      margin: 24px auto 0;
      opacity: 0.6;
    }

    @media (max-width: 480px) {
      .card {
        padding: 44px 24px 40px;
      }
      h1 {
        font-size: 1.6rem;
      }
      .icon svg {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B9EFF" />
            <stop offset="100%" stop-color="#8B5CF6" />
          </linearGradient>
          <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00D4FF" />
            <stop offset="100%" stop-color="#A855F7" />
          </linearGradient>
        </defs>
        <!-- gear / construction icon -->
        <path d="M50 22 L56 38 L72 40 L60 52 L64 68 L50 60 L36 68 L40 52 L28 40 L44 38 Z" 
              stroke="url(#grad1)" stroke-width="3" fill="none" stroke-linejoin="round"/>
        <circle cx="50" cy="50" r="16" stroke="url(#grad2)" stroke-width="2.5" fill="none" stroke-dasharray="4 6"/>
        <circle cx="50" cy="50" r="7" fill="#3B9EFF" opacity="0.9" />
      </svg>
    </div>

    <h1>Under Construction</h1>
    <p>We're working on something new. Please check back soon.</p>
    <div class="divider"></div>
  </div>
</body>
</html>
